<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Você no Controle{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <a href="/" class="marca">Você no Controle</a>
        <nav class="menu">
            <a href="/ficha">Ficha</a>
            <a href="/registrar">Registrar</a>
            <a href="/progresso">Progresso</a>
            <a href="/historico">Histórico</a>
        </nav>
    </header>

      <main class="conteudo">
        {% if request.path != '/' %}
            <a href="javascript:history.back()" class="link-voltar">← Voltar</a>
        {% endif %}

        {% with mensagens = get_flashed_messages() %}
            {% if mensagens %}
                <div class="alerta-erro">
                    {% for mensagem in mensagens %}
                        <p>{{ mensagem }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
