{% extends "base.html" %}

{% block titulo %}Ficha — Você no Controle{% endblock %}

{% block conteudo %}
    <h1>Ficha do Usuário</h1>

    <form method="POST" class="formulario">
        <label>Nome
            <input type="text" name="nome" value="{{ usuario['nome'] if usuario else '' }}" required>
        </label>

        <label>Idade
            <input type="number" name="idade" value="{{ usuario['idade'] if usuario else '' }}" required>
        </label>

        <label>Sexo
            <select name="sexo" required>
                <option value="M" {{ "selected" if usuario and usuario['sexo'] == 'M' else "" }}>Masculino</option>
                <option value="F" {{ "selected" if usuario and usuario['sexo'] == 'F' else "" }}>Feminino</option>
            </select>
        </label>

        <label>Peso atual (kg)
            <input type="number" step="0.1" name="peso_atual" value="{{ usuario['peso_atual'] if usuario else '' }}" required>
        </label>

        <label>Peso desejado (kg)
            <input type="number" step="0.1" name="peso_desejado" value="{{ usuario['peso_desejado'] if usuario else '' }}" required>
        </label>

        <label>Altura (cm)
            <input type="number" step="0.1" name="altura" value="{{ usuario['altura'] if usuario else '' }}" required>
        </label>

        <label>Nível de atividade
            <select name="nivel_atividade" required>
                <option value="1">Baixo</option>
                <option value="2">Médio</option>
                <option value="3">Bom</option>
                <option value="4">Ótimo</option>
            </select>
        </label>

        <label>Objetivo
            <select name="objetivo" required>
                <option value="1">Cut</option>
                <option value="2">Bulk</option>
                <option value="3">Manutenção</option>
            </select>
        </label>

        <button type="submit" class="botao">Salvar</button>
    </form>

    {% if usuario %}
        <div class="cartao-resultado">
            <p>TMB: <strong>{{ "%.0f"|format(usuario['tmb']) }} kcal</strong></p>
            <p>Meta diária: <strong>{{ "%.0f"|format(usuario['meta_calorica']) }} kcal</strong></p>
        </div>
    {% endif %}
{% endblock %}
