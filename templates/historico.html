{% extends "base.html" %}

{% block titulo %}Histórico — Você no Controle{% endblock %}

{% block conteudo %}
    <h1>Histórico</h1>

    {% if dias %}
        <ul class="lista-historico">
        {% for d in dias %}
            <li><a href="/historico/{{ d['data'] }}">{{ d['data'] }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p class="vazio">Nenhum dia registrado ainda.</p>
    {% endif %}
{% endblock %}
