{% extends "base.html" %}

{% block titulo %}Registrar Refeição — Você no Controle{% endblock %}

{% block conteudo %}
    <h1>Registrar Refeição</h1>

    <form method="POST" class="formulario">
        <label>Nome da refeição
            <input type="text" name="nome_refeicao" placeholder="Ex: Almoço" required>
        </label>

        <label>Categoria
            <select id="categoria">
                <option value="">-- escolha --</option>
            </select>
        </label>

        <label>Alimento
            <select name="alimento_id" id="alimento" required>
                <option value="">-- escolha a categoria primeiro --</option>
            </select>
        </label>

        <label>Gramas
            <input type="number" step="0.1" name="gramas" required>
        </label>

        <button type="submit" class="botao">Registrar</button>
    </form>

    <script>
        const alimentos = [
            {% for a in alimentos %}
                { id: {{ a['id'] }}, nome: "{{ a['nome'] }}", categoria: "{{ a['categoria'] }}" },
            {% endfor %}
        ];

        const selectCategoria = document.getElementById("categoria");
        const selectAlimento = document.getElementById("alimento");

        const categorias = [...new Set(alimentos.map(a => a.categoria))];
        categorias.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            selectCategoria.appendChild(opt);
        });

        selectCategoria.addEventListener("change", () => {
            selectAlimento.innerHTML = "";
            const filtrados = alimentos.filter(a => a.categoria === selectCategoria.value);

            if (filtrados.length === 0) {
                selectAlimento.innerHTML = "<option value=''>-- escolha a categoria primeiro --</option>";
                return;
            }

            filtrados.forEach(a => {
                const opt = document.createElement("option");
                opt.value = a.id;
                opt.textContent = a.nome;
                selectAlimento.appendChild(opt);
            });
        });
    </script>
{% endblock %}
